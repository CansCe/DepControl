name: project_cloud
description: >
  DepControl monorepo root. A Dart pub workspace (Dart 3.6+) that ties together
  the shared DTOs, the Dart Frog backend, and the Flutter Web frontend under a
  single lockfile and shared `.dart_tool/`. This root package is the workspace
  umbrella only — the runnable app is the `frontend` member.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

# Dart pub workspace. Members resolve together under this single root
# lockfile / .dart_tool. Run `flutter pub get` here once to resolve everything.
workspace:
  - packages/ecosystem
  - packages/shared
  - backend
  - frontend
  # The local collector. A member because it runs the same parsers the server
  # does and must resolve them to the same versions; `tools/api_differ` stays
  # out for the opposite reason, being pinned to a different `analyzer`.
  - tools/collector
