name: backend
description: DepControl API (Dart Frog).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  dart_frog: ^1.1.0
  # Both resolve to local workspace members under `packages/`. `ecosystem` is
  # the parsing half of a scan — manifest names, manifest syntax, constraint
  # dialects — kept out of here so the local collector can run it without a
  # server; the registry clients that go with it stay in `lib/src/ecosystem/`.
  ecosystem: ^0.1.0
  shared: ^0.1.0
  # Verifies Supabase (GoTrue) access tokens in auth middleware: JWKS signing
  # keys (ES256/RS256) and legacy HS256. pointycastle builds public keys from JWK.
  dart_jsonwebtoken: ^2.14.0
  pointycastle: ^3.9.1
  # Unpacks the repository tarball fetched in one request by GitFetcher.
  archive: ^4.0.0
  pubspec_parse: ^1.3.0
  pub_semver: ^2.1.4
  http: ^1.2.0
  uuid: ^4.4.0
  # Digests a report's contents, which is how a re-scan tells a new revision
  # of a project's dependencies from the same one seen again.
  crypto: ^3.0.0
  # Phase 3 persistence: direct connection to Supabase Postgres.
  postgres: ^3.5.0

dev_dependencies:
  dart_frog_cli: ^1.1.0
  lints: ^6.0.0
  # Test-only, and deliberately one-directional: the collector never depends on
  # `backend`, but a test proving that a bundle and a fetched repository give the
  # same report has to be able to produce a real bundle rather than a hand-built
  # imitation of one. A hand-built bundle would only ever prove that the ingest
  # agrees with the test's idea of a bundle.
  collector: ^0.1.0
  # Mocks RequestContext/Request in route tests (the Dart Frog testing recipe).
  mocktail: ^1.0.0
  test: ^1.25.0
