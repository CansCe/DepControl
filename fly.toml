# DepControl API -> Fly.io
#
# This file lives at the repo root rather than in `backend/` on purpose: fly
# uses the directory holding fly.toml as the Docker build context, and
# backend/Dockerfile needs the root so it can see `packages/shared`.
# `.dockerignore` keeps `frontend/`, `.git/` and the `.env` files out of the
# upload.

app = 'depcontrol-api'
primary_region = 'nrt'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  # Fly does not inject PORT. The generated dart_frog server defaults to 8080
  # anyway; this is set explicitly so the value sits next to internal_port
  # rather than being implied by the framework.
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero between requests, as `--min-instances 0` did. A compiled Dart
  # binary on a FROM-scratch image starts in well under a second, so the cold
  # start is the machine boot (~1s), not the app.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
