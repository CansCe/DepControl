# DepControl API -> Fly.io
#
# See https://fly.io/docs/reference/configuration/ for the full schema.
#
# This file must stay at the repo root: fly uses the directory holding fly.toml
# as the Docker build context, and backend/Dockerfile needs the root so it can
# see `packages/shared`. `.dockerignore` keeps `frontend/`, `.git/` and the
# `.env` files out of the upload.
#
# `fly launch` regenerates this file and will drop the comments and the
# dockerfile path — check the diff before merging anything it opens.

app = 'depcontrol-api'
primary_region = 'sin'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  # Fly does not inject PORT. The generated dart_frog server defaults to 8080
  # anyway; this is set explicitly so the value sits next to internal_port
  # rather than being implied by the framework.
  PORT = '8080'

  # How long with no request before the machine stops itself — see
  # `auto_stop_machines` below for why the app does this rather than the proxy.
  # Unset means never, which is what every local run and every test gets.
  IDLE_SHUTDOWN_SECONDS = '300'

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero between requests, still. A compiled Dart binary on a
  # FROM-scratch image starts in well under a second, so the cold start is the
  # machine boot, not the app.
  #
  # But the *proxy* must not be the one deciding. `auto_stop_machines` counts
  # connections, so it stops a machine that has no open request however busy the
  # process is — which was harmless while a scan was a request and is fatal now
  # that a scan is a job outliving the connection that asked for it. Closing the
  # browser would stop the machine mid-scan.
  #
  # So it is off, and `IdleWatchdog` does it from inside instead, with one extra
  # condition: no request for IDLE_SHUTDOWN_SECONDS *and* nothing in the scan
  # queue. Same scale-to-zero, one more thing that counts as busy.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# The watchdog stops the machine by exiting 0, so a policy that restarts a clean
# exit would turn scaling to zero into a restart loop. `on-failure` leaves a
# machine that exited 0 stopped, and `auto_start_machines` brings it back on the
# next request.
[[restart]]
  policy = 'on-failure'
  retries = 10

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
