# fly.toml app configuration file generated for project-cloud-weysgg on 2026-07-29T05:22:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'project-cloud-weysgg'
primary_region = 'sin'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
