# Builds the Dart Frog API and deploys it to Fly.io.
name: deploy-backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      # A direct runtime dependency of `backend` (parses manifests for scans).
      - 'packages/ecosystem/**'
      # Now part of the backend image build context (see backend/Dockerfile).
      - 'tools/collector/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.dockerignore'
      - 'fly.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
      # Resolved from the workspace root: `backend` and `shared` are members and
      # have no lockfile of their own. `frontend` is a member too, which is why
      # this needs the Flutter SDK rather than plain Dart.
      - run: flutter pub get
      - run: dart analyze backend packages/shared
      # Turns one broken connection string into one line, instead of into the
      # twenty-five integration tests that all fail on it. Every one of them
      # reports the same problem in the terms of whatever query it reached
      # first, so the suite says "the database layer is broken" when what is
      # broken is the secret — and the two are fixed in very different places.
      #
      # Does not gate the tests: it exits non-zero and fails the job, because a
      # run that cannot reach the database is a run with no coverage of it.
      # With no DATABASE_URL configured it prints that and passes, matching the
      # tests, which skip.
      - name: Check the database is reachable and current
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: dart run tool/check_database.dart

      - name: Test
        working-directory: backend
        # A secret is not an environment variable until it is mapped to one, and
        # the Postgres integration tests read DATABASE_URL straight from the
        # process environment. Without this they do not fail — they *skip*, and
        # a suite that silently stops covering the database layer is worse than
        # one that goes red.
        #
        # Empty when the secret is not configured, which the tests read as "no
        # database" and skip on, exactly as they do locally.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # `-P db` because the database tests are tagged and skipped by the
        # everyday local run — they cost more wall clock than the other 600 put
        # together, which is a price to pay once per push rather than once per
        # save. CI is where that price belongs. See backend/dart_test.yaml.
        run: dart test -P db

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fly publishes no stable release tag for this action; @master is what
      # their own documentation pins to.
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # Build settings, machine size and the scale-to-zero policy live in
        # fly.toml. DATABASE_URL and SUPABASE_URL are Fly secrets set once with
        # `fly secrets set`, never repo secrets or image layers — see
        # docs/DEPLOY.md.
        #
        # --remote-only builds on Fly's builder rather than needing a Docker
        # daemon here (it is the default, stated so it stays true if that
        # changes). --image-label replaces the default `deployment-{timestamp}`
        # registry tag with the commit, so a release is traceable to a SHA and
        # a rollback is `fly releases` + `fly deploy --image` of an earlier tag.
        run: flyctl deploy --remote-only --image-label "${GITHUB_SHA}"

      - name: Show service URL
        run: flyctl status
