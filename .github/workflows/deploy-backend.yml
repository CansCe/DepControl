# Builds the Dart Frog API and deploys it to Fly.io.
name: deploy-backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.dockerignore'
      - 'fly.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
      # Resolved from the workspace root: `backend` and `shared` are members and
      # have no lockfile of their own. `frontend` is a member too, which is why
      # this needs the Flutter SDK rather than plain Dart.
      - run: flutter pub get
      - run: dart analyze backend packages/shared
      - run: dart test
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fly publishes no stable release tag for this action; @master is what
      # their own documentation pins to.
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # Build settings, machine size and the scale-to-zero policy live in
        # fly.toml. DATABASE_URL and SUPABASE_URL are Fly secrets set once with
        # `fly secrets set`, never repo secrets or image layers — see
        # docs/DEPLOY.md.
        #
        # --remote-only builds on Fly's builder rather than needing a Docker
        # daemon here (it is the default, stated so it stays true if that
        # changes). --image-label replaces the default `deployment-{timestamp}`
        # registry tag with the commit, so a release is traceable to a SHA and
        # a rollback is `fly releases` + `fly deploy --image` of an earlier tag.
        run: flyctl deploy --remote-only --image-label "${GITHUB_SHA}"

      - name: Show service URL
        run: flyctl status
