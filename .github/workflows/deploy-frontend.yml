# Builds the Flutter Web bundle and deploys it to Firebase Hosting.
name: deploy-frontend

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      # Workspace members share the root lockfile, so this resolves everything.
      - run: flutter pub get

      - run: flutter test
        working-directory: frontend

      - name: Build web bundle
        # API_BASE_URL is compiled in — the deployed page is served from a
        # different origin than the API, so it cannot infer the address at
        # runtime. Set it as a repository *variable* (it is a public URL, not a
        # secret; a secret would be masked in logs for no benefit).
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
        working-directory: frontend

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        # firebase-tools picks up the credentials file that the auth step wrote
        # and exported as GOOGLE_APPLICATION_CREDENTIALS.
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
