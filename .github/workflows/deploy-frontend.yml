# Builds the Flutter Web bundle and deploys it to Cloudflare Pages.
name: deploy-frontend

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      # Workspace members share the root lockfile, so this resolves everything.
      - run: flutter pub get

      - run: flutter test
        working-directory: frontend

      - name: Build web bundle
        # API_BASE_URL is compiled in — the deployed page is served from a
        # different origin than the API, so it cannot infer the address at
        # runtime. Set it as a repository *variable* (it is a public URL, not a
        # secret; a secret would be masked in logs for no benefit).
        #
        # COLLECTOR_RELEASE_URL is the same idea for the collector's download
        # buttons. `|| '...'` falls back to this repo's own GitHub Releases —
        # a fork setting its own `vars.COLLECTOR_RELEASE_URL` overrides it, and
        # an empty result (no release published yet) is also a valid answer:
        # the registry screen degrades to the `dart run` instructions.
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=COLLECTOR_RELEASE_URL=${{ vars.COLLECTOR_RELEASE_URL || 'https://github.com/CansCe/project_cloud/releases/latest/download' }}
        working-directory: frontend

      - name: Deploy to Cloudflare Pages
        # The SPA rewrite and cache headers travel inside the bundle, as
        # frontend/web/_redirects and frontend/web/_headers — `flutter build
        # web` copies everything in web/ into the output. There is no
        # deploy-time config for them the way firebase.json was.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch must match the project's production branch, or this
          # publishes as a preview deploy on its own URL and the live site
          # never changes.
          command: pages deploy frontend/build/web --project-name=depcontrol --branch=master
