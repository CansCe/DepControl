# --enable-native-access silences the JDK 21 "restricted method" warnings from
# Gradle's native-platform JAR calling System::load. Cosmetic today, but the
# JDK will start blocking those calls outright in a future release.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
