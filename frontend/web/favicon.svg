<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="DepControl">
  <title>DepControl</title>

  <!-- App icon / favicon / OAuth badge.
       Solid tile rather than a transparent mark: at 16px a filled shape holds
       its silhouette, where loose strokes disintegrate. -->
  <rect width="64" height="64" rx="14" fill="#0553B1"/>

  <!-- Edges first, so the nodes sit on top of them. Round caps mean the strokes
       stop cleanly under each circle without needing trimmed endpoints. -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
    <line x1="32" y1="20" x2="18" y2="44"/>
    <line x1="32" y1="20" x2="46" y2="44"/>
  </g>

  <circle cx="32" cy="20" r="6" fill="#FFFFFF"/>
  <circle cx="18" cy="44" r="5.5" fill="#FFFFFF"/>

  <!-- The one node that matters. The whole app is about finding this leaf, so
       the mark says it rather than drawing a generic tree. -->
  <circle cx="46" cy="44" r="6.5" fill="#0553B1" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="46" cy="44" r="4" fill="#F59E0B"/>
</svg>
